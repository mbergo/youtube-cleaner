services:
  youtube-cleaner:
    build: .
    ports:
      - "8080:8080"
    environment:
      - YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID}
      - YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET}
      - YOUTUBE_REDIRECT_URL=${YOUTUBE_REDIRECT_URL:-http://localhost:8080/auth/callback}
      - PORT=8080
    restart: unless-stopped
