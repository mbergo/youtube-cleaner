<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC0000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0288D1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded rectangle background (YouTube-style) -->
  <rect x="40" y="120" width="432" height="272" rx="60" ry="60" fill="url(#bg)" />
  <!-- Play triangle -->
  <polygon points="220,200 220,312 310,256" fill="#FFFFFF" />
  <!-- Broom/sweep lines (cleaning motif) at top-right -->
  <g transform="translate(340, 80) rotate(25)">
    <!-- Broom handle -->
    <rect x="-4" y="-80" width="8" height="100" rx="4" fill="url(#sparkle)" />
    <!-- Broom bristles -->
    <path d="M-30,20 Q-25,45 -15,50 Q-5,55 0,55 Q5,55 15,50 Q25,45 30,20 Z" fill="url(#sparkle)" />
    <line x1="-20" y1="25" x2="-12" y2="48" stroke="#0288D1" stroke-width="2" />
    <line x1="-8" y1="22" x2="-4" y2="52" stroke="#0288D1" stroke-width="2" />
    <line x1="4" y1="22" x2="4" y2="52" stroke="#0288D1" stroke-width="2" />
    <line x1="14" y1="25" x2="10" y2="50" stroke="#0288D1" stroke-width="2" />
  </g>
  <!-- Sparkle stars (cleanliness) -->
  <g fill="#4FC3F7">
    <polygon points="100,100 105,85 110,100 125,105 110,110 105,125 100,110 85,105" />
    <polygon points="420,380 423,370 426,380 436,383 426,386 423,396 420,386 410,383" />
    <polygon points="80,350 83,342 86,350 94,352 86,354 83,362 80,354 72,352" />
  </g>
</svg>
